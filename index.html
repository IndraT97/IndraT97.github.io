<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indrajeet Thakare — Supply Chain Analytics & Data Engineering</title>
  <meta name="description" content="Indrajeet Thakare — Supply Chain Analytics and Data Engineering. Inventory optimisation, demand forecasting, and supply chain data pipelines. Experience at Levare, Tesla, and Blinkit.">
  <link rel="icon" href="fav.png" type="image/png">
  <meta property="og:title" content="Indrajeet Thakare — Supply Chain Analytics & Data Engineering">
  <meta property="og:description" content="Inventory optimisation, demand forecasting, and supply chain data pipelines. Experience at Levare, Tesla, and Blinkit.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://indrat97.github.io/">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    /* ── Tokens ─────────────────────────────────── */
    :root {
      --bg:          #070c19;
      --bg-alt:      #0b1220;
      --bg-card:     #0f1929;
      --bg-elevated: #152032;
      --border:      #1b2d42;
      --border-h:    #2a4560;
      --teal:        #64ffda;
      --teal-dim:    rgba(100,255,218,.08);
      --teal-glow:   rgba(100,255,218,.18);
      --text:        #cdd9e5;
      --text-dim:    #8898aa;
      --text-muted:  #4c6070;
      --fh: 'Space Grotesk', system-ui, sans-serif;
      --fb: 'Inter', system-ui, sans-serif;
      --r:  12px;
    }

    /* ── Reset ──────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--fb);
      line-height: 1.65;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Dot-grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle at 1px 1px, rgba(100,255,218,.055) 1px, transparent 0);
      background-size: 28px 28px;
      pointer-events: none;
      z-index: 0;
    }
    #root { position: relative; z-index: 1; }

    /* ── Container ──────────────────────────────── */
    .container { max-width: 1080px; margin: 0 auto; padding: 0 2rem; }

    /* ── Nav ────────────────────────────────────── */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 1.25rem 0;
      transition: background .3s, border-color .3s, padding .3s;
      border-bottom: 1px solid transparent;
    }
    .nav.scrolled {
      background: rgba(7,12,25,.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-color: var(--border);
      padding: .875rem 0;
    }
    .nav-inner {
      max-width: 1080px; margin: 0 auto; padding: 0 2rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo {
      font-family: var(--fh); font-weight: 700; font-size: 1.1rem;
      color: var(--teal); text-decoration: none; letter-spacing: -.02em;
    }
    .nav-links { display: flex; align-items: center; gap: 1.75rem; }
    .nav-links a {
      color: var(--text-dim); text-decoration: none;
      font-size: .875rem; font-weight: 500; letter-spacing: .01em;
      transition: color .2s;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--text); }
    .nav-cta {
      color: var(--teal) !important;
      border: 1px solid rgba(100,255,218,.35);
      padding: .375rem .9rem; border-radius: 6px;
      transition: background .2s, border-color .2s !important;
    }
    .nav-cta:hover { background: var(--teal-dim); border-color: var(--teal) !important; }

    /* ── Hero ───────────────────────────────────── */
    .hero {
      min-height: 100vh; display: flex; flex-direction: column;
      justify-content: center; padding: 7rem 2rem 4rem; position: relative;
    }
    .hero-inner {
      max-width: 1080px; margin: 0 auto; width: 100%;
      display: grid; grid-template-columns: 1fr 320px;
      gap: 4rem; align-items: center;
    }
    .hero-greeting {
      color: var(--teal); font-size: .85rem; font-weight: 600;
      letter-spacing: .12em; text-transform: uppercase;
      margin-bottom: .9rem; font-family: var(--fb);
    }
    .hero-name {
      font-family: var(--fh);
      font-size: clamp(3rem, 6vw, 4.75rem);
      font-weight: 700; line-height: 1.04; letter-spacing: -.035em;
      color: #e2eaf6; margin-bottom: .7rem;
    }
    .hero-role {
      font-family: var(--fh); font-size: 1.15rem; font-weight: 400;
      color: var(--text-dim); margin-bottom: 1.5rem;
    }
    .dot { color: var(--teal); margin: 0 .4em; }
    .hero-bio {
      font-size: .975rem; color: var(--text-dim);
      max-width: 500px; line-height: 1.8; margin-bottom: 2.25rem;
      text-wrap: pretty;
    }
    .hero-actions { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
    .btn-primary {
      background: var(--teal); color: #07111e;
      font-family: var(--fh); font-weight: 700; font-size: .875rem;
      padding: .65rem 1.5rem; border-radius: 8px; text-decoration: none;
      transition: background .2s, transform .15s, box-shadow .2s;
      letter-spacing: .01em; white-space: nowrap;
    }
    .btn-primary:hover { background: #80ffe8; transform: translateY(-1px); box-shadow: 0 8px 24px rgba(100,255,218,.28); }
    .btn-secondary {
      display: flex; align-items: center; gap: .4rem;
      color: var(--text); font-family: var(--fh); font-weight: 500; font-size: .875rem;
      padding: .65rem 1.25rem; border-radius: 8px; text-decoration: none;
      border: 1px solid var(--border); transition: border-color .2s, background .2s;
      white-space: nowrap;
    }
    .btn-secondary:hover { border-color: var(--border-h); background: var(--bg-card); }

    /* Photo */
    .hero-photo-col { display: flex; justify-content: center; }
    .photo-wrap { position: relative; }
    .photo-frame {
      width: 280px; height: 360px;
      border-radius: 16px; overflow: hidden;
      border: 1.5px solid rgba(100,255,218,.35);
      box-shadow: 0 0 60px rgba(100,255,218,.12), 0 24px 64px rgba(0,0,0,.5);
      position: relative; z-index: 1;
    }
    .photo-img {
      width: 100%; height: 100%;
      object-fit: cover; object-position: top center; display: block;
    }
    .photo-glow {
      position: absolute; inset: -20px; border-radius: 30px;
      background: radial-gradient(ellipse at 50% 40%, rgba(100,255,218,.15) 0%, transparent 70%);
      z-index: 0; pointer-events: none;
    }

    /* Scroll hint */
    .scroll-hint {
      position: absolute; bottom: 2.5rem; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: .5rem;
      color: var(--text-muted); font-size: .68rem;
      letter-spacing: .12em; text-transform: uppercase;
    }
    .scroll-line {
      width: 1px; height: 44px;
      background: linear-gradient(to bottom, transparent, var(--teal));
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }

    /* Hero specialty */
    .hero-role {
      font-family: var(--fh); font-size: 1.1rem; font-weight: 500;
      color: var(--teal); margin-bottom: .4rem; letter-spacing: -.01em;
    }
    .hero-specialty {
      font-size: .88rem; color: var(--text-muted); margin-bottom: 1.4rem;
      line-height: 1.6; font-weight: 400; min-height: 1.5em;
    }
    .typed { color: var(--teal); font-weight: 500; }
    .caret {
      color: var(--teal); font-weight: 400;
      animation: caretBlink 1s step-end infinite; margin-left: 1px;
    }
    @keyframes caretBlink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

    /* Stats strip */
    .hero-stats {
      max-width: 1080px; margin: 2.25rem auto 0;
      padding: 0 2rem; width: 100%;
      display: grid; grid-template-columns: repeat(4,1fr);
      background: var(--border); gap: 1px;
      border: 1px solid var(--border); border-radius: var(--r); overflow: hidden;
    }
    .stat-item {
      background: var(--bg-card); padding: 1.1rem 1rem;
      display: flex; flex-direction: column;
      align-items: center; gap: .15rem; text-align: center;
    }
    .stat-value {
      font-family: var(--fh); font-size: 1.7rem; font-weight: 700;
      color: var(--teal); line-height: 1; letter-spacing: -.025em;
    }
    .stat-label {
      font-size: .67rem; color: var(--text-muted); font-weight: 600;
      letter-spacing: .07em; text-transform: uppercase; white-space: nowrap;
    }

    /* Featured experience card (Tesla) */
    .exp-card.featured {
      border-top: 2px solid rgba(100,255,218,.55);
      background: var(--bg-elevated);
    }

    /* Section divider */
    .section-div {
      display: flex; justify-content: center;
      padding: 0; margin: -2rem 0; position: relative; z-index: 2;
    }
    .section-div-line {
      width: 1px; height: 64px;
      background: linear-gradient(to bottom,
        rgba(100,255,218,0),
        rgba(100,255,218,0.45) 50%,
        rgba(100,255,218,0)
      );
    }

    /* ── Sections ───────────────────────────────── */
    .section {
      padding: 6rem 2rem;
      opacity: 0; transform: translateY(28px);
      transition: opacity .65s ease, transform .65s ease;
    }
    .section.visible { opacity: 1; transform: translateY(0); }
    .section.alt { background: var(--bg-alt); }
    .section-head { margin-bottom: 3rem; }
    .section-label {
      display: block; color: var(--teal);
      font-size: .75rem; font-weight: 600;
      letter-spacing: .1em; text-transform: uppercase;
      margin-bottom: .4rem; font-family: var(--fb);
    }
    .section-title {
      font-family: var(--fh);
      font-size: clamp(1.75rem, 3.5vw, 2.4rem);
      font-weight: 700; letter-spacing: -.025em; color: #e2eaf6;
    }

    /* About */
    .about-grid {
      display: grid; grid-template-columns: 1fr 260px; gap: 3.5rem; align-items: start;
    }
    .about-text { display: flex; flex-direction: column; gap: 1.1rem; }
    .about-text p {
      font-size: .93rem; color: var(--text-dim); line-height: 1.8; text-wrap: pretty;
    }
    .about-path {
      display: flex; flex-direction: column; align-items: stretch;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 1.25rem;
    }
    .path-step {
      display: flex; flex-direction: column; gap: .1rem;
      padding: .6rem .75rem; border-radius: 8px;
    }
    .path-step.now { background: var(--teal-dim); border: 1px solid rgba(100,255,218,.22); }
    .path-co { font-family: var(--fh); font-weight: 600; font-size: .9rem; color: var(--text); }
    .path-step.now .path-co { color: var(--teal); }
    .path-role { font-size: .72rem; color: var(--text-muted); }
    .path-arrow { color: var(--teal); opacity: .45; text-align: center; font-size: .85rem; padding: .15rem 0; }

    /* Featured projects */
    .featured-grid {
      display: grid; grid-template-columns: repeat(3,1fr); gap: .875rem;
      margin-bottom: 2.25rem;
    }
    .featured-card {
      background: var(--bg-elevated);
      border: 1px solid rgba(100,255,218,.22);
      border-radius: var(--r); padding: 1.5rem;
      text-decoration: none; display: flex; flex-direction: column; gap: .7rem;
      transition: all .25s;
    }
    .featured-card:hover {
      border-color: rgba(100,255,218,.5);
      transform: translateY(-3px);
      box-shadow: 0 14px 44px rgba(0,0,0,.4);
    }
    .featured-flag {
      font-size: .64rem; font-weight: 700; color: var(--teal);
      letter-spacing: .12em; text-transform: uppercase;
    }
    .featured-title {
      font-family: var(--fh); font-size: 1rem; font-weight: 600;
      color: #e2eaf6; line-height: 1.4;
    }
    .featured-desc { font-size: .8rem; color: var(--text-dim); line-height: 1.65; flex: 1; }

    /* Company monogram */
    .co-logo {
      width: 30px; height: 30px; border-radius: 7px; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--teal-dim); border: 1px solid rgba(100,255,218,.25);
      color: var(--teal); font-family: var(--fh); font-weight: 700; font-size: .85rem;
      align-self: center;
    }

    /* ── Experience ─────────────────────────────── */
    .exp-list { display: flex; flex-direction: column; gap: 1.25rem; }
    .exp-card {
      display: grid; grid-template-columns: 180px 1fr; gap: 2rem;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 1.875rem;
      transition: border-color .25s, background .25s, transform .25s;
    }
    .exp-card:hover {
      border-color: rgba(100,255,218,.3);
      background: var(--bg-elevated);
      transform: translateX(4px);
    }
    .exp-meta { display: flex; flex-direction: column; gap: .5rem; padding-top: .15rem; }
    .exp-period { color: var(--text-dim); font-size: .82rem; font-weight: 500; line-height: 1.4; }
    .exp-badge {
      display: inline-block; width: fit-content;
      color: var(--teal); font-size: .7rem; font-weight: 600;
      letter-spacing: .06em; text-transform: uppercase;
      border: 1px solid rgba(100,255,218,.25); padding: .2em .55em;
      border-radius: 4px; background: var(--teal-dim);
    }
    .exp-title-row { display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap; margin-bottom: .875rem; }
    .exp-role { font-family: var(--fh); font-size: 1.15rem; font-weight: 600; color: #e2eaf6; }
    .exp-company {
      color: var(--teal); font-size: .85rem; font-weight: 500;
      text-decoration: none; transition: opacity .2s; opacity: .8;
    }
    .exp-company:hover { opacity: 1; }
    .exp-summary { font-size: .89rem; color: var(--text-dim); line-height: 1.8; margin-bottom: 1.25rem; text-wrap: pretty; }
    .exp-bullets { list-style: none; display: flex; flex-direction: column; gap: .45rem; margin-bottom: 1.25rem; }
    .exp-bullets li {
      font-size: .88rem; color: var(--text-dim);
      padding-left: 1.2em; position: relative; line-height: 1.65;
    }
    .exp-bullets li::before {
      content: '▸'; color: var(--teal); position: absolute;
      left: 0; font-size: .7em; top: .28em;
    }

    /* Role progression — LinkedIn vertical style */
    .exp-progression {
      display: flex; flex-direction: column; gap: 0;
      margin-bottom: 1.1rem;
      border-left: 2px solid rgba(100,255,218,0.28);
    }
    .prog-step {
      display: flex; align-items: center; gap: .75rem;
      padding: .35rem 0 .35rem .875rem;
      position: relative;
    }
    .prog-step::before {
      content: ''; position: absolute; left: -.3rem; top: 50%;
      transform: translateY(-50%);
      width: 6px; height: 6px;
      background: var(--teal); border-radius: 50%; opacity: .7;
    }
    .prog-title {
      font-family: var(--fh); font-size: .83rem;
      font-weight: 600; color: var(--text);
    }
    .prog-period { font-size: .72rem; color: var(--text-dim); }

    /* ── Tags ───────────────────────────────────── */
    .tag-row { display: flex; flex-wrap: wrap; gap: .35rem; }
    .tag {
      background: var(--teal-dim); color: var(--teal);
      font-size: .73rem; font-weight: 500;
      padding: .22em .6em; border-radius: 4px;
      font-family: var(--fb); letter-spacing: .02em;
      border: 1px solid rgba(100,255,218,.14);
    }
    .tag.sm { font-size: .67rem; }

    /* ── Projects ───────────────────────────────── */
    .filter-tabs { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: 2rem; }
    .filter-tab {
      display: flex; align-items: center; gap: .4rem;
      background: none; border: 1px solid var(--border);
      color: var(--text-dim); font-family: var(--fb); font-size: .82rem; font-weight: 500;
      padding: .35rem .9rem; border-radius: 6px; cursor: pointer; transition: all .2s;
    }
    .filter-tab:hover { border-color: var(--border-h); color: var(--text); }
    .filter-tab.active { background: var(--teal-dim); border-color: rgba(100,255,218,.45); color: var(--teal); }
    .tab-count {
      background: rgba(100,255,218,.15); color: var(--teal);
      font-size: .68rem; font-weight: 700; padding: .1em .45em;
      border-radius: 3px; min-width: 18px; text-align: center;
    }
    .projects-grid {
      display: grid; grid-template-columns: repeat(3,1fr); gap: .875rem;
    }
    .project-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 1.375rem;
      text-decoration: none; display: flex; flex-direction: column; gap: .75rem;
      transition: all .25s; cursor: pointer;
    }
    .project-card:hover {
      border-color: rgba(100,255,218,.32);
      background: var(--bg-elevated);
      transform: translateY(-2px);
      box-shadow: 0 10px 36px rgba(0,0,0,.32);
    }
    .project-header { display: flex; justify-content: space-between; align-items: center; }
    .project-cat {
      font-size: .68rem; font-weight: 700; color: var(--teal);
      letter-spacing: .08em; text-transform: uppercase;
    }
    .arrow-icon { width: 17px; height: 17px; color: var(--text-muted); transition: all .2s; flex-shrink: 0; }
    .project-card:hover .arrow-icon { color: var(--teal); transform: translate(2px,-2px); }
    .project-title {
      font-family: var(--fh); font-size: .9rem; font-weight: 600;
      color: var(--text); line-height: 1.45; flex: 1;
    }

    /* ── Certifications ─────────────────────────── */
    .certs-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 1rem; }
    .cert-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 1.5rem;
      display: flex; flex-direction: column; gap: .875rem;
      transition: all .25s;
    }
    .cert-card.clickable { cursor: pointer; }
    .cert-card:hover {
      border-color: rgba(100,255,218,.28);
      background: var(--bg-elevated);
      transform: translateY(-2px);
      box-shadow: 0 10px 36px rgba(0,0,0,.3);
    }
    .cert-logo-wrap { width: 44px; height: 44px; display: flex; align-items: center; }
    .cert-logo { width: 44px; height: 44px; object-fit: contain; }
    .cert-info { display: flex; flex-direction: column; gap: .25rem; }
    .cert-name { font-family: var(--fh); font-size: .85rem; font-weight: 600; color: var(--text); line-height: 1.4; }
    .cert-issuer { font-size: .75rem; color: var(--text-dim); }
    .cert-date { font-size: .72rem; color: var(--teal); font-weight: 500; }
    .cert-link { font-size: .7rem; color: var(--text-muted); margin-top: .1rem; }

    /* ── Skills ─────────────────────────────────── */
    .skills-groups { display: grid; grid-template-columns: repeat(3,1fr); gap: 2.25rem; }
    .skill-group-name {
      font-family: var(--fh); font-size: .75rem; font-weight: 700;
      color: var(--teal); letter-spacing: .09em; text-transform: uppercase;
      margin-bottom: .75rem;
    }
    .skill-tags { display: flex; flex-wrap: wrap; gap: .4rem; }
    .skill-tag {
      background: var(--bg-card); border: 1px solid var(--border);
      color: var(--text-dim); font-size: .82rem; font-weight: 500;
      padding: .3em .75em; border-radius: 6px; transition: all .2s;
    }
    .skill-tag:hover { border-color: rgba(100,255,218,.3); color: var(--teal); }

    /* ── Contact ────────────────────────────────── */
    .contact-inner { max-width: 560px; margin: 0 auto; text-align: center; }
    .contact-text { color: var(--text-dim); font-size: .975rem; margin-bottom: 2rem; line-height: 1.75; }
    .contact-email {
      display: inline-block; font-family: var(--fh); font-size: 1.05rem; font-weight: 600;
      color: var(--teal); text-decoration: none;
      border-bottom: 1px solid rgba(100,255,218,.3); padding-bottom: 2px;
      margin-bottom: 2.5rem; transition: border-color .2s;
    }
    .contact-email:hover { border-color: var(--teal); }
    .social-row { display: flex; gap: 1.5rem; justify-content: center; }
    .social-link {
      display: flex; align-items: center; gap: .45rem;
      color: var(--text-dim); text-decoration: none;
      font-size: .875rem; font-weight: 500; transition: color .2s;
    }
    .social-link:hover { color: var(--teal); }

    /* ── Footer ─────────────────────────────────── */
    .footer {
      display: flex; align-items: center; justify-content: center; gap: .6rem;
      padding: 1.75rem 2rem; border-top: 1px solid var(--border);
      color: var(--text-muted); font-size: .78rem;
    }
    .footer-sep { color: var(--border-h); }

    /* ── Responsive ─────────────────────────────── */
    @media (max-width: 860px) {
      .hero-inner { grid-template-columns: 1fr; gap: 2.5rem; }
      .hero-photo-col { order: -1; }
      .photo-frame { width: 200px; height: 250px; }
      .exp-card { grid-template-columns: 1fr; gap: 1rem; }
      .about-grid { grid-template-columns: 1fr; gap: 2rem; }
